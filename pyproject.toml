[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "quantum-sim"
version = "0.1.0"
description = "A small hybrid Rust and Python quantum circuit simulator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
manifest-path = "crates/qsim-python/Cargo.toml"
python-source = "python"
module-name = "quantum_sim._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/integration"]
